<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets — TEDxWittyIntlSchoolYouth</title>
<style>
  :root {
    --black: #0a0a0a;
    --red: #e62b1e;
    --muted: #8c8c8c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--black);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .reveal-wrap { max-width: 640px; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    line-height: 1.05;
    color: var(--red);
    margin: 0 0 1.25rem;
  }
  p {
    color: var(--muted);
    font-size: 1rem;
    margin: 0 0 2rem;
    letter-spacing: 0.02em;
  }
  a.back-link {
    color: var(--red);
    text-decoration: none;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--red);
    padding-bottom: 2px;
  }
  a.back-link:hover { opacity: 0.8; }
</style>
</head>
<body>
  <div class="reveal-wrap">
    <h1>Yet to be<br>revealed</h1>
    <p>Ticket registration opens soon. Check back shortly.</p>
    <a href="index.html" class="back-link">← Back to the event page</a>
  </div>
</body>
</html>
